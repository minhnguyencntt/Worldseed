worker:
  world_id: "the-boys-room"
  repo_path: "."
  poll_interval: "30s"
  execution_timeout: "30m"
  max_retries: 2
  work_root: ".storyforge/work"
  max_budget: 5
  auto_publish: false
  provider_kind: "mock"

log:
  level: "info"

store:
  dir: ".storyforge/executions"
  lock_path: ".storyforge/worker.lock"
