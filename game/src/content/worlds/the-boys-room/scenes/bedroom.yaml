id: bedroom
title: Bedroom
openingDialogue: intro
dialogue:
  - id: intro
    speaker: boy
    text: "I don't know what to do next. What should we do?"
    choices:
      - text: Look around the room
        next: look-around
        events:
          - type: set_flag
            flag: looked_around
            value: true
      - text: "Let's explore"
        next: explore
        events:
          - type: set_flag
            flag: exploring
            value: true
  - id: look-around
    speaker: boy
    text: There is a bookshelf, a computer, a bed, a window and a door.
    choices:
      - text: Okay
  - id: explore
    speaker: boy
    text: Something in here must lead somewhere.
    choices:
      - text: Okay
characters:
  - id: boy
    name: The Boy
    position: { x: 230, y: 240 }
    animations:
      idle: { asset: character:boy-sheet, animation: idle }
      walk: { asset: character:boy-sheet, animation: walk }
      interact: { asset: character:boy-sheet, animation: interact }

objects:
  - id: bed
    name: Bed
    description: A rumpled bed with a faded blanket.
    asset: room/bed
    position: { x: 290, y: 165 }
    scale: 1
    layer: furniture
    interactionBounds: { x: 0, y: 0, width: 104, height: 40 }
    actions:
      - id: inspect
        label: Inspect
        events:
          - type: show_text
            text: The blanket is warm and smells faintly of cedar.
      - id: search
        label: Search
        events:
          - type: add_item
            item: old-key
          - type: show_text
            text: Under the pillow you find an old key.

  - id: bookshelf
    name: Bookshelf
    description: A tall bookshelf crammed with worn paperbacks.
    asset: room/bookshelf
    position: { x: 150, y: 60 }
    scale: 1
    layer: furniture
    interactionBounds: { x: 0, y: 0, width: 48, height: 96 }
    persistentState:
      flag: secret_door_open
    actions:
      - id: inspect
        label: Inspect
        events:
          - type: show_text
            text: Dusty spines line the shelves, mostly adventure stories.
      - id: push
        label: Push
        events:
          - type: show_text
            text: The bookshelf is heavy and does not budge.
      - id: search
        label: Search
        events:
          - type: set_flag
            flag: secret_door_open
            value: true
          - type: show_text
            text: A hidden door swings open behind the books.
      - id: leave
        label: Leave
        events: []

  - id: desk
    name: Desk
    description: A cluttered desk covered in pencils and loose paper.
    asset: room/desk
    position: { x: 20, y: 150 }
    scale: 1
    layer: furniture
    interactionBounds: { x: 0, y: 0, width: 80, height: 32 }
    actions:
      - id: inspect
        label: Inspect
        events:
          - type: show_text
            text: Pencil sketches of dragons cover the desk.

  - id: secret-door-open
    name: Secret Door
    description: A narrow passage hidden behind the bookshelf.
    asset: secret-door/open
    position: { x: 158, y: 92 }
    scale: 1
    layer: objects
    visibleWhen:
      - flag: secret_door_open
    interactionBounds: { x: 0, y: 0, width: 32, height: 64 }
    actions:
      - id: inspect
        label: Inspect
        events:
          - type: show_text
            text: A narrow passage lies behind the shelf.

  - id: old-computer
    name: Old Computer
    description: A beige desktop computer with a dusty monitor.
    asset: room/computer
    position: { x: 45, y: 118 }
    scale: 1
    layer: objects
    interactionBounds: { x: 0, y: 0, width: 30, height: 34 }
    persistentState:
      flag: computer_on
    actions:
      - id: inspect
        label: Inspect
        events:
          - type: show_text
            text: The monitor is dark and the power light is off.
      - id: search
        label: Search
        events:
          - type: set_flag
            flag: computer_on
            value: true
          - type: show_text
            text: The old computer whirs to life.

  - id: window
    name: Window
    description: A window with the blinds half drawn.
    asset: objects/window
    position: { x: 30, y: 25 }
    scale: 1
    layer: objects
    interactionBounds: { x: 0, y: 0, width: 60, height: 50 }
    actions:
      - id: inspect
        label: Inspect
        events:
          - type: show_text
            text: Through the blinds you can see the street below.
          - type: set_flag
            flag: window_seen
            value: true

  - id: door
    name: Door
    description: A closed wooden door leading out of the room.
    asset: objects/door
    position: { x: 270, y: 40 }
    scale: 1
    layer: objects
    interactionBounds: { x: 0, y: 0, width: 40, height: 80 }
    actions:
      - id: inspect
        label: Inspect
        events:
          - type: show_text
            text: The door is solid oak with a brass handle.
      - id: leave
        label: Leave
        conditions:
          - hasItem: old-key
        events:
          - type: set_flag
            flag: door_unlocked
            value: true
          - type: show_text
            text: The old key turns in the lock.

effects:
  - type: dust
    asset: effect:dust
    count: 20
    area: { x: 0, y: 0, width: 320, height: 180 }
  - type: ambientLight
    color: '#ffd9a0'
    alpha: 0.15
  - type: transition
    kind: fade
    durationMs: 400
