id: bedroom
title: Bedroom
openingDialogue: intro
dialogue:
  - id: intro
    speaker: boy
    text: "I don't know what to do next. What should we do?"
    choices:
      - text: Look around the room
      - text: "Let's explore"
objects:
  - id: bed
    name: Bed
    description: A rumpled bed with a faded blanket.
    asset: objects/bed
    position: { x: 165, y: 85 }
    scale: 1
    layer: furniture
    interactionBounds: { x: 0, y: 0, width: 100, height: 35 }
    actions:
      - id: inspect
        label: Inspect
        events:
          - type: show_text
            text: The blanket is warm and smells faintly of cedar.

  - id: bookshelf
    name: Bookshelf
    description: A tall bookshelf crammed with worn paperbacks.
    asset: objects/bookshelf
    position: { x: 110, y: 30 }
    scale: 1
    layer: furniture
    interactionBounds: { x: 0, y: 0, width: 44, height: 90 }
    persistentState:
      flag: secret_door_open
    actions:
      - id: inspect
        label: Inspect
        events:
          - type: show_text
            text: Dusty spines line the shelves, mostly adventure stories.
      - id: push
        label: Push
        events:
          - type: show_text
            text: The bookshelf is heavy and does not budge.
      - id: search
        label: Search
        events:
          - type: set_flag
            flag: secret_door_open
            value: true
          - type: show_text
            text: A hidden door swings open behind the books.
      - id: leave
        label: Leave
        events: []

  - id: desk
    name: Desk
    description: A cluttered desk covered in pencils and loose paper.
    asset: objects/desk
    position: { x: 20, y: 100 }
    scale: 1
    layer: furniture
    interactionBounds: { x: 0, y: 0, width: 70, height: 28 }
    actions:
      - id: inspect
        label: Inspect
        events:
          - type: show_text
            text: Pencil sketches of dragons cover the desk.

  - id: old-computer
    name: Old Computer
    description: A beige desktop computer with a dusty monitor.
    asset: objects/old-computer
    position: { x: 38, y: 72 }
    scale: 1
    layer: objects
    interactionBounds: { x: 0, y: 0, width: 30, height: 34 }
    persistentState:
      flag: computer_on
    actions:
      - id: inspect
        label: Inspect
        events:
          - type: show_text
            text: The monitor is dark and the power light is off.
      - id: search
        label: Search
        events:
          - type: set_flag
            flag: computer_on
            value: true
          - type: show_text
            text: The old computer whirs to life.

  - id: window
    name: Window
    description: A window with the blinds half drawn.
    asset: objects/window
    position: { x: 30, y: 25 }
    scale: 1
    layer: objects
    interactionBounds: { x: 0, y: 0, width: 60, height: 50 }
    actions:
      - id: inspect
        label: Inspect
        events:
          - type: show_text
            text: Through the blinds you can see the street below.

  - id: door
    name: Door
    description: A closed wooden door leading out of the room.
    asset: objects/door
    position: { x: 270, y: 40 }
    scale: 1
    layer: objects
    interactionBounds: { x: 0, y: 0, width: 40, height: 80 }
    actions:
      - id: inspect
        label: Inspect
        events:
          - type: show_text
            text: The door is solid oak with a brass handle.
      - id: leave
        label: Leave
        events: []
